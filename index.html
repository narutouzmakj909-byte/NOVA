<style>
/* NOVA core interface and animated voice canvas. */
:root{
  --bg:#05070d; --surface:#0b0f1a; --raised:#141a2b; --line:#222b44;
  --fg:#e6ecff; --dim:#9aa6c7; --cyan:#4dd6ff; --violet:#9b7bff; --err:#ff4d6d; --ok:#3cf2c5;
  --display:'Space Grotesk',system-ui,sans-serif; --body:'Inter',system-ui,sans-serif;
  --glow:0 0 0 1px #4dd6ff33,0 0 22px #4dd6ff22;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  display:flex;flex-direction:column;overflow:hidden;position:relative}
/* subtle background motion */
body::before,body::after{content:"";position:fixed;z-index:-1;width:70vmax;height:70vmax;border-radius:50%;filter:blur(70px);opacity:.16;pointer-events:none}
body::before{background:var(--cyan);top:-35vmax;left:-30vmax;animation:drift1 22s ease-in-out infinite alternate}
body::after{background:var(--violet);bottom:-40vmax;right:-30vmax;animation:drift2 28s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(12vmax,8vmax)}}
@keyframes drift2{to{transform:translate(-10vmax,-9vmax)}}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
button{font:inherit;color:inherit}

/* header */
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0 6px;flex:none}
.wordmark{font:600 22px var(--display);letter-spacing:.38em;padding-left:.1em;margin:0;
  background:linear-gradient(100deg,var(--cyan),var(--violet) 45%,var(--cyan) 90%);background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 10px #4dd6ff55);
  animation:wm-in .9s cubic-bezier(.2,.8,.2,1) both,wm-shift 7s ease-in-out infinite alternate;
  flex:none}
@keyframes wm-in{from{opacity:0;transform:translateX(-14px);letter-spacing:.7em;filter:blur(6px)}}
@keyframes wm-shift{to{background-position:100% 0}}
.hright{display:flex;align-items:center;gap:6px;min-width:0}
.profile{display:flex;align-items:center;gap:10px;min-width:0;background:none;border:1px solid transparent;border-radius:999px;padding:4px 10px 4px 4px;cursor:pointer;min-height:44px;transition:background .2s,border-color .2s,transform .15s}
.profile:hover{background:var(--surface);border-color:var(--line)}
.profile:active{transform:scale(.96)}
.avatar{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:600 15px var(--display);color:#05223a;
  background:linear-gradient(135deg,var(--cyan),var(--violet));box-shadow:0 0 14px #4dd6ff44}
.pname{display:flex;flex-direction:column;min-width:0;text-align:left;line-height:1.2}
.pname b{font:600 13px var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:22vw}
.pname small{font-size:11px;color:var(--dim)}
.iconbtn{flex:none;width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);display:grid;place-items:center;cursor:pointer;transition:transform .15s,box-shadow .2s,border-color .2s}
.iconbtn:hover{border-color:var(--cyan);box-shadow:var(--glow)}
.iconbtn:active{transform:scale(.92)}
.iconbtn svg{width:24px;height:24px;fill:currentColor}
@media (max-width:360px){.pname{display:none}}

/* views */
main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;overscroll-behavior:contain}
.view{display:none;flex:1;min-height:0;flex-direction:column}
.view.on{display:flex}
#v-page.on{animation:pg .38s cubic-bezier(.2,.8,.2,1) both}
@keyframes pg{from{opacity:0;transform:translateX(18px)}}
#status{text-align:center;font:500 22px var(--display);margin-top:4px;transition:color .4s}
#status.err{color:var(--err)}
.stage{flex:1;min-height:200px;display:flex;align-items:center;justify-content:center;position:relative}
#orb{width:min(100%,62vh,440px);aspect-ratio:1;display:block}
.mic{align-self:center;position:relative;width:76px;height:76px;border-radius:50%;border:1px solid #ffffff40;
  background:linear-gradient(135deg,var(--cyan),var(--violet));opacity:.45;cursor:not-allowed;display:grid;place-items:center;margin-top:6px}
.mic::before{content:"";position:absolute;inset:-16px;border-radius:50%;
  background:radial-gradient(closest-side,#4dd6ff55,transparent);animation:pulse 1.8s ease-in-out infinite alternate}
.mic svg{width:30px;height:30px;fill:#05070d;position:relative}
@keyframes pulse{from{transform:scale(.85)}to{transform:scale(1.15)}}
.note{text-align:center;font-size:12px;color:var(--dim);margin:10px 0 12px}
.label{font:600 10px var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 0 14px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 14px;font:inherit;font-size:13px;cursor:pointer;min-height:44px;transition:transform .15s,box-shadow .2s,background .2s}
.chip:hover{box-shadow:var(--glow)}
.chip:active{transform:scale(.94)}
.chip[aria-pressed=true]{background:var(--cyan);color:#05223a;border-color:var(--cyan);font-weight:600;box-shadow:0 0 18px #4dd6ff66}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

/* pages */
.pad{padding:14px 0 24px;display:flex;flex-direction:column;gap:14px}
.hero{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:22px;padding:22px 20px;background:linear-gradient(160deg,#141a2b,#0b0f1a)}
.hero::before{content:"";position:absolute;inset:-40% -20% auto auto;width:240px;height:240px;border-radius:50%;background:radial-gradient(closest-side,#9b7bff40,transparent);animation:pulse 4s ease-in-out infinite alternate}
.hico{position:relative;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,#4dd6ff33,#9b7bff33);border:1px solid #4dd6ff44;box-shadow:0 0 22px #4dd6ff22;margin-bottom:14px}
.hico svg{width:26px;height:26px;fill:var(--cyan)}
.hero h1{position:relative;font-size:28px}
.hero p{position:relative;margin:6px 0 0;color:var(--dim)}
.badge{position:relative;display:inline-flex;align-items:center;gap:6px;margin-top:12px;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;color:var(--violet);background:#9b7bff1a;border:1px solid #9b7bff44}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--violet)}
.badge.live{color:var(--ok);background:#3cf2c51a;border-color:#3cf2c544}
.badge.live::before{background:var(--ok)}
.cards{display:grid;gap:10px}
.fcard{display:flex;gap:14px;align-items:flex-start;background:var(--raised);border:1px solid var(--line);border-radius:16px;padding:16px;opacity:.92}
.fdot{flex:none;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:#4dd6ff14;border:1px solid #4dd6ff2e}
.fdot svg{width:18px;height:18px;fill:var(--cyan)}
.fcard h3{font-size:15px}
.fcard p{margin:2px 0 0;font-size:13px;color:var(--dim)}
.fcard .st{display:inline-block;margin-top:8px;font-size:11px;color:var(--dim);border:1px dashed var(--line);border-radius:999px;padding:2px 10px}
.empty{text-align:center;border:1px dashed var(--line);border-radius:18px;padding:26px 18px;color:var(--dim);font-size:13px;background:#0b0f1a99}
.empty .ring{width:54px;height:54px;border-radius:50%;margin:0 auto 12px;border:2px solid #4dd6ff44;border-top-color:var(--cyan);animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.composer{display:flex;gap:10px;align-items:center;opacity:.5}
.composer input{flex:1;min-width:0;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:0 14px;font:inherit}
.composer button{width:48px;height:48px;border-radius:14px;border:0;background:linear-gradient(135deg,var(--cyan),var(--violet));cursor:not-allowed}
.dim{color:var(--dim)}
.sec{padding:16px;border:1px solid var(--line);border-radius:18px;background:var(--raised);display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:6px 0;min-height:44px}
.sw{appearance:none;-webkit-appearance:none;width:52px;height:30px;border-radius:15px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .2s,box-shadow .2s;margin:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.sw:checked{background:var(--cyan);box-shadow:0 0 14px #4dd6ff66} .sw:checked::after{transform:translateX(22px)}
.sw:active::after{width:28px}
.plist{margin:0;padding-left:20px;color:var(--dim);font-size:13px}.plist li{margin:4px 0}

/* drawer */
#scrim{position:fixed;inset:0;background:#02040a99;backdrop-filter:blur(2px);opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s;z-index:20}
#scrim.on{opacity:1;visibility:visible}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(86vw,340px);z-index:30;background:linear-gradient(180deg,#0e1424,#080b14);border-left:1px solid var(--line);
  transform:translateX(105%);visibility:hidden;transition:transform .34s cubic-bezier(.2,.8,.2,1),visibility .34s;display:flex;flex-direction:column;
  padding:calc(12px + env(safe-area-inset-top,0px)) 14px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:-20px 0 50px #0008}
#drawer.on{transform:none;visibility:visible}
.dhead{display:flex;align-items:center;justify-content:space-between;padding:0 4px 8px}
.dnav{flex:1;overflow-y:auto;overscroll-behavior:contain;padding-bottom:8px}
.dgroup{margin:14px 6px 6px}
.ditem{display:flex;align-items:center;gap:14px;width:100%;min-height:48px;padding:10px 12px;border:1px solid transparent;border-radius:14px;background:none;color:var(--dim);text-align:left;cursor:pointer;font-size:15px;transition:background .2s,color .2s,transform .15s,box-shadow .2s}
.ditem svg{width:22px;height:22px;fill:currentColor;flex:none}
.ditem:hover{background:var(--surface);color:var(--fg)}
.ditem:active{transform:scale(.97)}
.ditem[aria-current=page]{color:var(--cyan);background:linear-gradient(90deg,#4dd6ff1f,#9b7bff14);border-color:#4dd6ff44;box-shadow:inset 3px 0 0 var(--cyan),0 0 18px #4dd6ff1a;font-weight:600}
@media (prefers-reduced-motion:reduce){
  .mic::before,.hero::before,.empty .ring{animation:none}
  body::before,body::after{animation:none}
  .wordmark{animation:none}
  #v-page.on{animation:none}
  #drawer,#scrim{transition:none}
}
.mic.on{opacity:1;cursor:pointer;border:0;transition:transform .15s,box-shadow .2s}.mic.on:active{transform:scale(.93)}.mic.live{box-shadow:0 0 0 3px #ff4d6d99}
.rec{display:none;align-items:center;gap:6px;justify-content:center;font-size:12px;color:var(--err);margin-top:8px}.rec.on{display:flex}.rec::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--err);animation:pulse 1s infinite alternate}
.btn{min-height:44px;padding:0 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;transition:transform .15s,box-shadow .2s,border-color .2s}
.btn:hover{border-color:var(--cyan);box-shadow:var(--glow)}.btn:active{transform:scale(.95)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:linear-gradient(135deg,var(--cyan),var(--violet));color:#05223a;font-weight:600;border:0}.btn.danger{border-color:var(--err);color:var(--err)}.btn.busy{opacity:.6;pointer-events:none}
.t{width:100%;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:10px 12px;font:inherit}
.cmp{display:flex;gap:8px}.cmp .t{flex:1;min-width:0}
.msgs{display:flex;flex-direction:column;gap:8px}.msg{max-width:88%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:#4dd6ff22;border:1px solid #4dd6ff44}.msg.assistant{align-self:flex-start;background:var(--raised);border:1px solid var(--line)}
.msg a,.src a{color:var(--cyan)}.src{font-size:12px;margin-top:6px;color:var(--dim)}
.item{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--raised)}.item span{flex:1;min-width:0;overflow-wrap:anywhere}.item.done span{text-decoration:line-through;opacity:.55}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:#141a2b;border:1px solid var(--line);border-radius:14px;padding:10px 16px;max-width:90vw;font-size:13px}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover}
</style>
<style>
/* NOVA visual system */
:root{
  --bg:#070b13;--surface:#0d1421;--raised:#111c2c;--line:#243349;
  --fg:#eef5ff;--dim:#92a3bd;--cyan:#67e8f9;--violet:#a78bfa;--err:#fb7185;--ok:#5eead4;
  --glow:0 0 0 1px #67e8f933,0 12px 38px #0007,0 0 36px #22d3ee12;
}
html,body{min-height:100%;height:100%;height:100dvh}
body{isolation:isolate;background:
  radial-gradient(ellipse at 48% -14%,#142640 0,transparent 48%),
  radial-gradient(ellipse at 110% 80%,#271c4a36,transparent 45%),
  var(--bg);color:var(--fg);font-family:Inter,system-ui,sans-serif}

  background:
    radial-gradient(ellipse at 13% 28%,#0c98ad23,transparent 32%),
    radial-gradient(ellipse at 84% 40%,#7c3aed1c,transparent 34%);
  animation:ambient-drift 24s ease-in-out infinite alternate}
body::after{z-index:-1;inset:0;width:auto;height:auto;border-radius:0;filter:none;opacity:.12;
  background-image:linear-gradient(#a8c3e908 1px,transparent 1px),linear-gradient(90deg,#a8c3e908 1px,transparent 1px);
  background-size:56px 56px;mask-image:linear-gradient(to bottom,black,transparent 88%);animation:none}
@keyframes ambient-drift{to{transform:translate3d(2vw,1vh,0) scale(1.04)}}
header{position:relative;z-index:2;padding:14px 0 10px;border-bottom:1px solid #ffffff0b}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand-mark{position:relative;display:grid;place-items:center;width:38px;height:38px;border:1px solid #67e8f94a;border-radius:13px;
  background:linear-gradient(145deg,#67e8f923,#a78bfa1c);box-shadow:inset 0 0 18px #67e8f911,0 0 24px #67e8f914;overflow:hidden}

@keyframes mark-orbit{to{transform:rotate(1turn)}}
.wordmark{font-size:20px;letter-spacing:.34em;font-weight:600;animation:wordmark-glow 5s ease-in-out infinite alternate}

#status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 12px currentColor}
#status.err::before{background:var(--err)}

.mic{width:58px;height:58px;min-width:58px;min-height:58px;margin:0;border:1px solid #ffffff29;opacity:1;cursor:pointer;
  background:#111b29;box-shadow:0 10px 28px #0005;transition:transform .2s,border-color .2s,background .2s,box-shadow .25s}
.mic::before{inset:-8px;background:radial-gradient(closest-side,#67e8f92e,transparent);animation:mic-breathe 2.4s ease-in-out infinite alternate}

  radial-gradient(ellipse at 92% 4%,#a78bfa1a,transparent 35%),

.hero::before{right:-40px;top:-80px;width:180px;height:180px;background:radial-gradient(closest-side,#67e8f929,transparent);animation:pulse 5s ease-in-out infinite alternate}
.hico{border-radius:15px;background:linear-gradient(145deg,#67e8f923,#a78bfa20);border-color:#67e8f942}

<script>
// ---------- NOVA signal core: each visual mode follows the real assistant state ----------
const S={
 idle:{l:'Ready',p:[104,218,239],s:[155,141,255]},
 listening:{l:'Listening',p:[75,241,202],s:[82,180,255]},
 thinking:{l:'Thinking',p:[185,143,255],s:[96,199,255]},
 speaking:{l:'Speaking',p:[113,226,255],s:[185,132,255]},
 searching:{l:'Searching',p:[90,210,245],s:[89,245,210]},
 error:{l:'Something went wrong',p:[255,105,132],s:[255,180,105]}
};
const cv=document.getElementById('orb'),ctx=cv.getContext('2d');
let savedVisual={};try{savedVisual=JSON.parse(localStorage.getItem('nova.visual')||'{}')}catch{}
const opts={reduced:typeof savedVisual.reduced==='boolean'?savedVisual.reduced:matchMedia('(prefers-reduced-motion: reduce)').matches,count:[20,40,70].includes(savedVisual.count)?savedVisual.count:40};
document.body.classList.toggle('reduce-motion',opts.reduced);
const launch=document.getElementById('launch');
try{if(sessionStorage.getItem('nova.launchSeen'))launch.classList.add('exit');else{sessionStorage.setItem('nova.launchSeen','1');setTimeout(()=>launch.classList.add('exit'),760)}}catch{setTimeout(()=>launch.classList.add('exit'),760)}
let state='idle',cur=JSON.parse(JSON.stringify(S.idle)),time=0,phase=0,voiceLevel=0,voiceTarget=0,lastVoiceInput=0,last=0,parts=[],W=0;
const TAU=Math.PI*2;
function setVoiceActivity(level){voiceTarget=Math.max(0,Math.min(1,level));lastVoiceInput=performance.now()}
function seed(){let x=7;const r=()=>(x=(x*16807)%2147483647)/2147483647;
 parts=Array.from({length:opts.count},()=>({a:r()*TAU,rad:.42+r()*.52,sp:.12+r()*.28,sz:.7+r()*1.8,ph:r()*TAU,depth:r()}));}
function size(){const w=cv.clientWidth;if(!w)return;const d=Math.min(devicePixelRatio||1,w<500?1.35:1.7);W=w;cv.width=cv.height=Math.round(w*d);ctx.setTransform(d,0,0,d,0,0);}
const rgba=(c,a)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${Math.max(0,Math.min(1,a))})`;
const lerp=(a,b,k)=>a+(b-a)*k;
function frame(now){
 requestAnimationFrame(frame);
 if(document.hidden||!document.getElementById('v-voice').classList.contains('on'))return;
 const dt=Math.min((now-last)/1000||0,.05);last=now;
 const T=S[state]||S.idle,k=1-Math.exp(-dt*4),m=opts.reduced?.18:1;
 for(let i=0;i<3;i++){cur.p[i]=lerp(cur.p[i],T.p[i],k);cur.s[i]=lerp(cur.s[i],T.s[i],k);}
 if(state==='listening'&&now-lastVoiceInput>480)voiceTarget=0;
 voiceLevel=lerp(voiceLevel,voiceTarget,1-Math.exp(-dt*8));
 time+=dt*m;
 const speed={idle:.16,listening:.28,thinking:1.05,speaking:.68,searching:.72,error:.18}[state]||.2;
 phase+=dt*speed*m;
 draw();
}
function draw(){
 if(!W)size();
 const r=W/2,t=time,cx=r,cy=r,P=cur.p,Sc=cur.s;
 const active=state==='speaking'?.23+.18*(.5+.5*Math.sin(t*5.4))+voiceLevel*.28:
   state==='listening'?voiceLevel:state==='thinking'?.34:state==='searching'?.18:0;
 const breathe=state==='idle'?.014*Math.sin(t*.72):.012*Math.sin(t*1.1);
 const coreR=r*(state==='thinking'?.205:.225)*(1+breathe+active*.14);
 ctx.clearRect(0,0,W,W);
 let glow=ctx.createRadialGradient(cx,cy,coreR*.1,cx,cy,r*.94);
 glow.addColorStop(0,rgba(P,state==='idle'?.13:.18+active*.08));glow.addColorStop(.42,rgba(Sc,.08));glow.addColorStop(1,rgba(Sc,0));
 ctx.fillStyle=glow;ctx.fillRect(0,0,W,W);

 // Fine star dust and orbital paths keep the idle state alive without overpowering it.
 for(const p of parts){
  const a=p.a+phase*p.sp*(state==='thinking'?2.2:1),d=r*p.rad*(1+(state==='listening'?voiceLevel*.035:0));
  const x=cx+Math.cos(a)*d,y=cy+Math.sin(a)*d*.73,tw=.5+.5*Math.sin(t*1.2+p.ph);
  ctx.fillStyle=rgba(p.depth>.55?Sc:P,.13+tw*.25);
  ctx.beginPath();ctx.arc(x,y,r*.0025*p.sz*(.75+tw),0,TAU);ctx.fill();
 }
 ctx.save();ctx.translate(cx,cy);ctx.lineCap='round';ctx.lineJoin='round';
 if(state==='idle'){
  for(let i=0;i<3;i++){ctx.save();ctx.rotate(phase*(i%2?-.45:.62)+i*.62);ctx.beginPath();ctx.ellipse(0,0,r*(.38+i*.115),r*(.135+i*.043),0,0,TAU);
   ctx.strokeStyle=rgba(i===1?Sc:P,.2-i*.035);ctx.lineWidth=Math.max(1,r*.0035);ctx.stroke();
   const a=t*.18+i*2.1;ctx.beginPath();ctx.arc(Math.cos(a)*r*(.38+i*.115),Math.sin(a)*r*(.135+i*.043),r*.009,0,TAU);
   ctx.fillStyle=rgba(P,.74);ctx.shadowColor=rgba(P,.8);ctx.shadowBlur=r*.035;ctx.fill();ctx.restore();}
 }else if(state==='listening'){
  for(let i=0;i<4;i++){const q=(t*.2+i*.25)%1,rr=coreR*(1.45+q*3.3+voiceLevel*.16);
   ctx.beginPath();ctx.ellipse(0,0,rr,rr*.72,0,0,TAU);ctx.strokeStyle=rgba(P,(1-q)*(.07+voiceLevel*.31));ctx.lineWidth=Math.max(1,r*.004);ctx.stroke();}
  for(let i=0;i<48;i++){const a=i/48*TAU+phase*.1,wave=.5+.5*Math.sin(a*7+t*2.2),len=r*(.012+voiceLevel*(.022+wave*.075));
   ctx.beginPath();ctx.moveTo(Math.cos(a)*r*.36,Math.sin(a)*r*.36);ctx.lineTo(Math.cos(a)*(r*.36+len),Math.sin(a)*(r*.36+len));
   ctx.strokeStyle=rgba(P,.12+voiceLevel*(.25+wave*.42));ctx.lineWidth=Math.max(1,r*.0045);ctx.stroke();}
 }else if(state==='thinking'){
  for(let layer=0;layer<3;layer++){const rr=r*(.39+layer*.105),rot=-phase*(layer%2?1:-1)+layer*.36;
   ctx.save();ctx.rotate(rot);ctx.beginPath();
   for(let i=0;i<6;i++){const a=i/6*TAU-Math.PI/2,x=Math.cos(a)*rr,y=Math.sin(a)*rr;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}
   ctx.closePath();ctx.setLineDash(layer===1?[r*.018,r*.035]:[]);ctx.strokeStyle=rgba(layer===1?Sc:P,.18+layer*.055);ctx.lineWidth=Math.max(1,r*.004);ctx.stroke();ctx.setLineDash([]);
   for(let i=0;i<6;i++){const a=i/6*TAU-Math.PI/2,x=Math.cos(a)*rr,y=Math.sin(a)*rr;
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(x,y);ctx.strokeStyle=rgba(Sc,.09+layer*.025);ctx.lineWidth=Math.max(1,r*.002);ctx.stroke();
    ctx.beginPath();ctx.arc(x,y,r*(.007+layer*.001),0,TAU);ctx.fillStyle=rgba(i%2?P:Sc,.52);ctx.fill();}
   ctx.restore();}
 }else if(state==='speaking'){
  for(let i=0;i<3;i++){const q=(t*.34+i/3)%1,rr=coreR*(1.45+q*4.15);
   ctx.beginPath();ctx.arc(0,0,rr,0,TAU);ctx.strokeStyle=rgba(P,(1-q)*(.15+active*.2));ctx.lineWidth=Math.max(1,r*.005);ctx.stroke();}
  for(let i=0;i<72;i++){const a=i/72*TAU+phase*.08,wave=.5+.5*Math.sin(i*.83-t*5.2),len=r*(.018+active*(.025+wave*.095));
   ctx.beginPath();ctx.moveTo(Math.cos(a)*r*.38,Math.sin(a)*r*.38);ctx.lineTo(Math.cos(a)*(r*.38+len),Math.sin(a)*(r*.38+len));
   ctx.strokeStyle=rgba(i%3?P:Sc,.22+active*(.24+wave*.46));ctx.lineWidth=Math.max(1,r*.0048);ctx.stroke();}
 }else if(state==='searching'){
  ctx.save();ctx.rotate(-phase*.26);ctx.beginPath();ctx.ellipse(0,0,r*.64,r*.39,0,0,TAU);ctx.strokeStyle=rgba(P,.26);ctx.lineWidth=Math.max(1,r*.005);ctx.stroke();
  const scan=(t*.25)%1,scanX=-r*.58+scan*r*1.16;ctx.beginPath();ctx.moveTo(scanX,-r*.25);ctx.lineTo(scanX,r*.25);
  ctx.strokeStyle=rgba(Sc,.72);ctx.lineWidth=Math.max(1,r*.008);ctx.shadowColor=rgba(Sc,.8);ctx.shadowBlur=r*.05;ctx.stroke();ctx.restore();
 }else if(state==='error'){
  ctx.rotate(Math.sin(t*4)*.015);ctx.beginPath();ctx.arc(0,0,r*.57,phase*.3,phase*.3+TAU*.83);ctx.strokeStyle=rgba(P,.48);ctx.lineWidth=Math.max(1,r*.008);ctx.stroke();
  ctx.beginPath();ctx.arc(0,0,r*.64,phase*.3+Math.PI,phase*.3+Math.PI*1.76);ctx.strokeStyle=rgba(Sc,.3);ctx.stroke();
 }
 ctx.restore();

 // A luminous, faceted energy body replaces the previous smile-shaped sphere.
 const core=ctx.createRadialGradient(cx-coreR*.32,cy-coreR*.38,coreR*.04,cx,cy,coreR*1.12);
 core.addColorStop(0,'rgba(245,254,255,.98)');core.addColorStop(.16,rgba(P,.97));core.addColorStop(.57,rgba(Sc,.88));core.addColorStop(1,'rgba(8,18,31,.96)');
 ctx.save();ctx.shadowColor=rgba(P,.34+active*.26);ctx.shadowBlur=coreR*(state==='idle'?.38:.62);ctx.fillStyle=core;
 ctx.beginPath();ctx.arc(cx,cy,coreR,0,TAU);ctx.fill();ctx.restore();
 ctx.save();ctx.beginPath();ctx.arc(cx,cy,coreR*.96,0,TAU);ctx.clip();
 for(let i=-2;i<=2;i++){const yy=cy+i*coreR*.34,span=Math.sqrt(Math.max(.04,1-(i*.17)**2))*coreR;
  ctx.beginPath();ctx.ellipse(cx,yy,span,coreR*(.09+Math.abs(i)*.012),phase*.18,0,TAU);
  ctx.strokeStyle=rgba(i%2?Sc:P,.11+active*.08);ctx.lineWidth=Math.max(1,r*.003);ctx.stroke();}
 const shine=ctx.createRadialGradient(cx-coreR*.37,cy-coreR*.42,0,cx-coreR*.26,cy-coreR*.32,coreR*.8);
 shine.addColorStop(0,'rgba(255,255,255,.56)');shine.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=shine;ctx.fillRect(cx-coreR,cy-coreR,coreR*2,coreR*2);
 ctx.restore();
 ctx.beginPath();ctx.arc(cx,cy,coreR*1.06,0,TAU);ctx.strokeStyle=rgba(P,.35+active*.25);ctx.lineWidth=Math.max(1,r*.003);ctx.stroke();
}

 let providerSnapshot=null,providerError=false;

<script>
// ---------- NOVA engine (real events, no manual states) ----------

const ld=(k,d)=>{try{const v=localStorage.getItem('nova.'+k);return v==null?d:JSON.parse(v)}catch{return d}};
const sv=(k,v)=>{try{localStorage.setItem('nova.'+k,JSON.stringify(v))}catch{toast('Could not save: browser storage is unavailable or full.')}};
let cfg=Object.assign({name:'NOVA User',lang:'en',provider:'openrouter',ttsProvider:'elevenlabs',speed:1,vol:1,mem:true,pic:'',speakChat:false,barge:false},ld('cfg',{}));
if(cfg.provider==='openai'){cfg.provider='openrouter';sv('cfg',cfg)}
let msgs=ld('msgs',[]),mem=ld('mem',[]),tasks=ld('tasks',[]),rem=ld('rem',[]),res=ld('res',[]);
const I={en:{idle:'Ready',listening:'Listening',thinking:'Thinking',searching:'Searching',speaking:'Speaking',error:'Something went wrong',note:'Tap the microphone to start. NOVA listens while voice mode is on.',on:'Listening is on. Speak naturally.',net:'Cannot reach the NOVA backend. Is server.js running?',mic:'Microphone permission was denied. Allow it in your browser or Android settings.',nosr:'Speech recognition is not supported in this browser. Use Chrome.'},
 so:{idle:'Diyaar',listening:'Waan dhegaysanayaa',thinking:'Waan fekerayaa',searching:'Waan raadinayaa',speaking:'Waan hadlayaa',error:'Khalad ayaa dhacay',note:'Taabo mikrafoonka si aad u bilowdo. NOVA wuu ku dhegaysanayaa inta codku shidan yahay.',on:'Dhegaystuhu waa shidan yahay. Hadal.',net:'Server-ka NOVA lagama gaari karo.',mic:'Oggolaanshaha mikrafoonka waa la diiday.',nosr:'Browser-kan ma taageero aqoonsiga codka.'}};
const t=k=>(I[cfg.lang]||I.en)[k]||I.en[k]||k, lab=s=>t(s);
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const A={voice:false,rec:null,busy:false,gen:0,audio:null,abort:null,retry:0};
function toast(m){let e=$('#toast');if(!e){e=document.createElement('div');e.id='toast';document.body.append(e)}e.textContent=m;e.hidden=false;clearTimeout(e._t);e._t=setTimeout(()=>e.hidden=true,4000)}
function updHeader(){const a=$('.pname b'),b=$('.pname small'),v=$('.avatar');if(a)a.textContent=cfg.name;if(b)b.textContent=cfg.lang==='so'?'Soomaali':'English';
 if(v)v.innerHTML=cfg.pic?`<img alt="" src="${cfg.pic}">`:esc((cfg.name||'N')[0].toUpperCase())}
function micUI(){const live=A.voice,button=$('#micBtn');button.classList.toggle('live',live);button.classList.toggle('on',live);

 $('#micLabel').textContent=live?'Tap to turn listening off':'Tap to talk';

const API_BASE='https://nova-2tv2.onrender.com';
async function api(url,body,n=1){try{const r=await fetch(API_BASE+url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
 if(!r.ok){const d=await r.json().catch(()=>({}));throw Object.assign(new Error(d.error||'Server error '+r.status),{status:r.status})}return r}
 catch(e){if(n>0&&(e instanceof TypeError||e.status>=502)){await new Promise(z=>setTimeout(z,800));return api(url,body,n-1)}
  throw e instanceof TypeError?new Error(t('net')):e}}
function fail(e){const m=(e&&e.message)||String(e);setState('error');status.textContent=m.slice(0,90);toast(m);clearTimeout(A.et);A.et=setTimeout(()=>{if(state==='error')settle()},3500)}
function settle(){A.busy=false;if(A.voice)listen();else setState('idle');micUI()}
// --- listening ---
function listen(){if(!A.voice||A.rec||A.busy)return;
 if(!SR){stopVoice();return fail(new Error(t('nosr')))}
 const r=new SR();A.rec=r;r.lang=cfg.lang==='so'?'so-SO':'en-US';r.interimResults=true;r.continuous=false;let fin='',tmp='';
 r.onstart=()=>{if(state!=='speaking')setState('listening');micUI()};
 r.onresult=e=>{fin='';tmp='';for(const x of e.results){if(x.isFinal)fin+=x[0].transcript;else tmp+=x[0].transcript}
  const heard=(fin||tmp).trim();if(state==='speaking'&&heard)interrupt();$('#tr').textContent=heard;
  if(fin.trim())A.heard=fin.trim()};
 r.onerror=e=>{A.rerr=e.error};
 r.onend=()=>{A.rec=null;const err=A.rerr,text=A.heard;A.rerr=A.heard=null;
  if(err==='not-allowed'||err==='service-not-allowed'){stopVoice();return fail(new Error(t('mic')))}
  if(err==='network'){stopVoice();return fail(new Error('Speech recognition needs an internet connection.'))}
  if(err&&err!=='no-speech'&&err!=='aborted'){if(++A.retry>3){stopVoice();return fail(new Error('Speech recognition failed: '+err))}}else A.retry=0;
  if(text)turn(text);else if(A.voice&&!A.busy)setTimeout(listen,300)};
 try{r.start()}catch{A.rec=null}}
function startVoice(){A.voice=true;A.retry=0;micUI();listen()}
function stopVoice(){A.voice=false;A.gen++;A.busy=false;if(A.rec){try{A.rec.abort()}catch{}}stopSpeech();setState('idle');micUI()}

// --- speaking (ElevenLabs / Somali TextReadTTS via backend only) ---
function stopSpeech(){if(A.abort)A.abort.abort();if(A.audio){A.audio.pause();A.audio=null}}
async function speakAll(text,g){if(!cfg.vol)return;const parts=text.match(/[^.!?\n]+[.!?]*\s*/g)||[text],ch=[];let c='';
 for(const p of parts){if((c+p).length>600&&c){ch.push(c);c=''}c+=p}if(c.trim())ch.push(c);
 A.busy=false;setState('speaking');if(A.voice)listen();micUI();
 const somali=cfg.ttsProvider==='somali';
 for(const part of ch){if(g!==A.gen||!cfg.vol)return;A.abort=new AbortController();
  const endpoint=somali?'/api/tts/somali':'/api/tts';
  const body=somali?{text:part}:{text:part,speed:cfg.speed};
  const r=await fetch(API_BASE+endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:A.abort.signal}).catch(e=>{if(e.name==='AbortError')return null;throw new Error(t('net'))});
  if(!r)return;if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.error||'Voice error '+r.status)}

const needsSearch=x=>/\b(today|latest|news|current|currently|now|price|weather|score|president|ceo|search|202\d|maanta|war\s?xog|cusub|hadda|qiimaha|cimilada)\b/i.test(x);
function add(role,content,extra){msgs.push(Object.assign({role,content,t:Date.now()},extra));msgs=msgs.slice(-200);sv('msgs',msgs);

function local(x){let m;

async function llm(history,extra={}){const r=await api('/api/chat',Object.assign({messages:history.map(({role,content})=>({role,content})),provider:cfg.provider,lang:cfg.lang,memory:cfg.mem?mem.map(m=>m.t):[]},extra));return r.json()}

  if(l)out=l;else{const s=needsSearch(text)?await webSearch(text):null;if(g!==A.gen)return;setState('thinking');

 try{if(Notification.permission==='granted')new Notification('NOVA',{body:r.t})}catch{}
 if(cfg.vol>0)speakAll(r.t,A.gen).catch(()=>{})}if(ch){sv('rem',rem);if(window.PG==='reminders')render('reminders')}},15000);
R.research=()=>hd('Research','Real web search with sources.')+`<div class="cmp"><input class="t" id="qi" placeholder="What should I research?" onkeydown="event.key==='Enter'&&doRes()"><button class="btn pri" id="qb" onclick="doRes()">Search</button></div>`+(res.length?res.slice().reverse().map(r=>`<div class="sec"><b>${esc(r.q)}</b><div style="white-space:pre-wrap">${esc(r.text)}</div><div class="src">${(r.sources||[]).map((s,i)=>`[${i+1}] <a target="_blank" rel="noopener" href="${esc(s.url)}">${esc(s.title)}</a>`).join('<br>')||'No sources (search unavailable).'}</div></div>`).join(''):empty('No research yet.'));
async function doRes(){const q=$('#qi').value.trim();if(!q)return;$('#qb').classList.add('busy');const s=await webSearch(q);setState('thinking');
 try{const d=await llm([{role:'user',content:'Research and summarize, separating confirmed facts from uncertain ones: '+q}],{search:s});res.push({q,text:d.text,sources:s.results||[]});sv('res',res);setState('idle')}catch(e){fail(e)}render('research')}
R.social=()=>hd('Social Media Assistant','Ideas, titles, captions, hashtags. No guaranteed results.')+`<select class="t" id="sp"><option>TikTok</option><option>YouTube</option><option>Instagram</option><option>Facebook</option></select><textarea class="t" id="si" rows="4" placeholder="Describe your video or post"></textarea><button class="btn pri" id="sb" onclick="doSoc()">Generate</button><div class="sec" id="so" hidden></div>`;
async function doSoc(){const x=$('#si').value.trim();if(!x)return;$('#sb').classList.add('busy');
 try{const d=await llm([{role:'user',content:`Give 3 title ideas, a caption and hashtags for ${$('#sp').value}. Never promise views or followers. Topic: ${x}`}]);$('#so').hidden=false;$('#so').style.whiteSpace='pre-wrap';$('#so').textContent=d.text}catch(e){toast(e.message)}$('#sb').classList.remove('busy')}
let shareStream=null;
R.screen=()=>hd('Screen Sharing','Starts only after you approve. Stop any time.')+(shareStream?`<div class="rec on">Sharing your screen</div><button class="btn danger" onclick="stopShare()">Stop sharing</button>`:`<button class="btn pri" onclick="startShare()">Start sharing</button>`)+empty(shareStream?'Screen is being captured locally. Nothing is uploaded.':'Screen sharing is off. Nothing is captured. Android system-wide capture needs the native app (MediaProjection).');
async function startShare(){try{if(!navigator.mediaDevices||!navigator.mediaDevices.getDisplayMedia)throw new Error('This browser cannot share the screen. A native Android app is required.');
 shareStream=await navigator.mediaDevices.getDisplayMedia({video:true});shareStream.getTracks()[0].onended=stopShare;render('screen')}catch(e){toast(e.name==='NotAllowedError'?'Screen sharing permission denied.':e.message)}}
function stopShare(){if(shareStream){shareStream.getTracks().forEach(x=>x.stop());shareStream=null;if(window.PG==='screen')render('screen')}}
R.profile=()=>hd('Profile & Language','Saved on this device.')+`<div class="sec"><label>Name<input class="t" id="pn" value="${esc(cfg.name)}" onchange="cfg.name=this.value.trim()||'NOVA User';sv('cfg',cfg);updHeader()"></label><label>Picture<input class="t" type="file" accept="image/*" onchange="setPic(this.files[0])"></label><div class="label">Language</div><div class="chips"><button class="chip" aria-pressed="${cfg.lang==='en'}" onclick="setLang('en')">English</button><button class="chip" aria-pressed="${cfg.lang==='so'}" onclick="setLang('so')">Soomaali</button></div></div>`;
function setPic(f){if(!f)return;const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d'),s=Math.min(i.width,i.height);x.drawImage(i,(i.width-s)/2,(i.height-s)/2,s,s,0,0,128,128);cfg.pic=c.toDataURL('image/jpeg',.8);sv('cfg',cfg);updHeader();toast('Picture updated.')};i.src=URL.createObjectURL(f)}
function setLang(l){cfg.lang=l;sv('cfg',cfg);updHeader();micUI();setState(state);render(window.PG)}
async function testProv(){const b=$('#tb');b.classList.add('busy');try{await api('/api/test',{provider:cfg.provider},0);toast(cfg.provider+' works.')}catch(e){toast(cfg.provider+': '+e.message)}b.classList.remove('busy')}
$('#micBtn').onclick=()=>A.voice?stopVoice():startVoice();
$('#orb').onclick=()=>{if(state==='speaking')interrupt()};
addEventListener('pagehide',()=>{if(A.rec)try{A.rec.abort()}catch{}});
updHeader();micUI();setState('idle');
</script>

<script>
// NOVA add-on 1: tasks, alarms with music, memory in settings, typing indicator.
(()=>{
const css=`
.mic,.mic *,.core-state{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.mic{touch-action:manipulation}
.typing{display:flex;gap:5px;align-items:center;padding:14px 16px}.typing i{width:7px;height:7px;border-radius:50%;background:var(--cyan);animation:tdot 1s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes tdot{0%,80%,100%{transform:translateY(0);opacity:.35}40%{transform:translateY(-6px);opacity:1}}
.chat-compose .btn.pri.busy{position:relative;color:transparent}.chat-compose .btn.pri.busy::after{content:"";position:absolute;inset:0;margin:auto;width:18px;height:18px;border:2px solid #07182066;border-top-color:#071820;border-radius:50%;animation:spin .8s linear infinite}
.tcard{display:grid;gap:12px;padding:16px;border:1px solid #ffffff14;border-radius:18px;background:linear-gradient(145deg,#111b2adf,#0c1421ed)}
.amp{display:grid;gap:10px;padding:12px;border:1px dashed #67e8f933;border-radius:14px}
.amp .row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.amp small{color:var(--dim)}
.aico{display:inline-grid;place-items:center;width:22px;height:22px;margin-right:8px;vertical-align:middle}.aico svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.eq rect{fill:currentColor;stroke:none;transform-box:fill-box;transform-origin:bottom;animation:eq 1s ease-in-out infinite}.eq rect:nth-child(2){animation-delay:.2s}.eq rect:nth-child(3){animation-delay:.4s}
@keyframes eq{50%{transform:scaleY(.35)}}
.bell{transform-origin:50% 10%;animation:ring 2.4s ease-in-out infinite}@keyframes ring{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(14deg)}20%,40%{transform:rotate(-14deg)}}
.upl{animation:upl 1.8s ease-in-out infinite}@keyframes upl{50%{transform:translateY(-3px)}}
.acard{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid #ffffff14;border-radius:18px;background:linear-gradient(145deg,#111b2a,#0d1521)}
.acard.done{opacity:.55}.acard .time{font:600 28px var(--display);letter-spacing:-.03em}.acard .meta{flex:1;min-width:0;display:grid;gap:2px}.acard .meta span{overflow-wrap:anywhere}.acard small{color:var(--dim)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#aeeef6;border:1px solid #67e8f927;border-radius:999px;padding:2px 9px;width:max-content}
.ringbox{position:fixed;inset:auto 16px calc(20px + env(safe-area-inset-bottom,0px)) 16px;z-index:60;display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid #67e8f966;border-radius:18px;background:#10243aee;box-shadow:0 0 40px #67e8f933}
.ringbox span{flex:1}`;
document.head.append(Object.assign(document.createElement('style'),{textContent:css}));
const ico={eq:'<svg class="eq" viewBox="0 0 24 24"><rect x="4" y="6" width="3.5" height="14" rx="1"/><rect x="10.2" y="3" width="3.5" height="17" rx="1"/><rect x="16.5" y="8" width="3.5" height="12" rx="1"/></svg>',
 bell:'<svg class="bell" viewBox="0 0 24 24"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/></svg>',
 up:'<svg class="upl" viewBox="0 0 24 24"><path d="M12 16V5m0 0-4 4m4-4 4 4M5 19h14"/></svg>'};
const ic=(k)=>`<span class="aico">${ico[k]}</span>`;
// ---- audio storage (IndexedDB) ----
const DB=()=>new Promise((ok,no)=>{const q=indexedDB.open('nova-audio',1);q.onupgradeneeded=()=>q.result.createObjectStore('f');q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)});
const put=async(id,b)=>{const d=await DB();return new Promise((ok,no)=>{const t=d.transaction('f','readwrite');t.objectStore('f').put(b,id);t.oncomplete=ok;t.onerror=()=>no(t.error)})};
const get=async id=>{const d=await DB();return new Promise((ok,no)=>{const q=d.transaction('f').objectStore('f').get(id);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})};
const TONES={chime:[880,1320],pulse:[440,440],beacon:[660,990,660]};let ac,RING=null;
function tone(n){ac=ac||new AudioContext();ac.resume();let i=0;const f=TONES[n]||TONES.chime,id=setInterval(()=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f[i++%f.length];g.gain.setValueAtTime(.25,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.5);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+.5)},600);return()=>clearInterval(id)}
function stopRing(){if(RING){RING.stop();RING.box&&RING.box.remove();clearTimeout(RING.t);RING=null}}
async function play(a,label,loop=true){stopRing();let stop;
 if(a.builtin)stop=tone(a.id);else{const b=await get(a.id);if(!b)return toast('The attached audio file is missing.');const u=URL.createObjectURL(b),el=new Audio(u);el.loop=loop;el.volume=cfg.vol||1;
  try{await el.play()}catch{return toast('The browser blocked audio. Tap the page once and try again.')}stop=()=>{el.pause();URL.revokeObjectURL(u)}}
 const box=document.createElement('div');box.className='ringbox';box.innerHTML=`${ic('bell')}<span>${esc(label)}</span><button class="btn danger">Stop</button>`;box.querySelector('button').onclick=stopRing;document.body.append(box);
 RING={stop,box,t:setTimeout(stopRing,60000)}}
// ---- alarm sound picker ----
let PICK={builtin:true,id:'chime',name:'Chime'};
const picker=()=>`<div class="amp"><div class="label">${ico.eq?'':''}Choose Your Music</div><div class="chips" style="padding:0">${Object.keys(TONES).map(n=>`<button class="chip" aria-pressed="${PICK.builtin&&PICK.id===n}" onclick="NA.tone('${n}')">${n[0].toUpperCase()+n.slice(1)}</button>`).join('')}</div>
<div class="row2"><label class="btn">${ic('up')}Choose Music<input type="file" accept="audio/*" hidden onchange="NA.file(this.files[0])"></label><button class="btn" onclick="NA.test()">${ic('eq')}Preview</button></div><small>Selected: ${esc(PICK.name)}${PICK.builtin?'':' (your file)'}</small></div>`;
const NA=window.NA={
 tone(n){PICK={builtin:true,id:n,name:n[0].toUpperCase()+n.slice(1)};rerender()},
 async file(f){if(!f)return;if(!/^audio\//.test(f.type))return toast('Please choose an audio file.');if(f.size>15e6)return toast('File is too large (15 MB max).');
  const id='a'+Date.now();try{await put(id,f)}catch{return toast('Could not store the audio file in this browser.')}PICK={builtin:false,id,name:f.name};rerender()},
 test(){play(PICK,'Previewing: '+PICK.name)},
 addTask(){const x=$('#ti').value.trim();if(!x)return;const k={id:Date.now(),t:x,done:false};tasks.push(k);sv('tasks',tasks);const d=$('#td').value;
  if(d){rem.push({id:k.id+1,t:x,at:new Date(d).getTime(),task:k.id,fired:false,audio:{...PICK}});sv('rem',rem)}render('tasks')},
 addRem(){const x=$('#rt').value.trim(),d=$('#rd').value;if(!x||!d)return toast('Enter text and a time.');rem.push({id:Date.now(),t:x,at:new Date(d).getTime(),fired:false,audio:{...PICK}});sv('rem',rem);render('reminders')},
 async swap(id,f){if(!f)return;const a='a'+Date.now();await put(a,f);const r=rem.find(x=>x.id===id);r.audio={builtin:false,id:a,name:f.name};r.played=false;sv('rem',rem);render('reminders')},
 memDel(id){mem=mem.filter(x=>x.id!==id);sv('mem',mem);settings()},
 memAdd(){const i=$('#mi2'),x=i.value.trim();if(!x)return;mem.push({id:Date.now(),t:x});sv('mem',mem);settings()},
 memEdit(id){editMem(id);setTimeout(settings,0)}};
const rerender=()=>render(window.PG);
// ---- Tasks ----
R.tasks=()=>hd('Tasks','Plan it. Time it. Hear it.')+`<div class="tcard"><input class="t" id="ti" placeholder="What needs doing?"><input class="t" id="td" type="datetime-local" aria-label="Alarm time">${picker()}<button class="btn pri" onclick="NA.addTask()">${ic('bell')}Set Alarm</button></div>`+
 (tasks.length?tasks.map(k=>{const r=rem.find(x=>x.task===k.id);return`<div class="item ${k.done?'done':''}"><input type="checkbox" class="sw" ${k.done?'checked':''} aria-label="Done" onchange="tasks.find(x=>x.id===${k.id}).done=this.checked;sv('tasks',tasks);render('tasks')"><span>${esc(k.t)}${r?`<br><small class="dim">${new Date(r.at).toLocaleString()}</small> <span class="pill">${ico.bell?'♪':''} ${esc(r.audio?r.audio.name:'no sound')}</span>`:''}</span><button class="btn danger" onclick="tasks=tasks.filter(x=>x.id!==${k.id});rem=rem.filter(x=>x.task!==${k.id});sv('tasks',tasks);sv('rem',rem);render('tasks')">Delete</button></div>`}).join(''):empty('No tasks yet.'));
// ---- Reminders ----
R.reminders=()=>hd('Alarms','Rings while NOVA is open. Closed-app alarms need the Android app.')+`<div class="tcard"><input class="t" id="rt" placeholder="Remind me to…"><input class="t" id="rd" type="datetime-local" aria-label="Time">${picker()}<button class="btn pri" onclick="NA.addRem()">${ic('bell')}Set Alarm</button><button class="btn" onclick="Notification.requestPermission().then(p=>toast('Notifications: '+p))">Allow notifications</button></div>`+
 (rem.length?rem.slice().sort((a,b)=>a.at-b.at).map(r=>{const d=new Date(r.at);return`<div class="acard ${r.fired?'done':''}"><div class="time">${d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div><div class="meta"><span>${esc(r.t)}</span><small>${d.toLocaleDateString()}</small><span class="pill">♪ ${esc(r.audio?r.audio.name:'voice only')}</span></div><label class="btn" aria-label="Change sound">${ic('up')}<input type="file" accept="audio/*" hidden onchange="NA.swap(${r.id},this.files[0])"></label><button class="btn danger" onclick="rem=rem.filter(x=>x.id!==${r.id});sv('rem',rem);render('reminders')">✕</button></div>`}).join(''):empty('No alarms yet.'));
// ring when a reminder with audio has just fired (core timer marks fired; we play the attached sound)
setInterval(()=>{const now=Date.now();let ch=false;for(const r of rem)if(r.fired&&r.audio&&!r.played&&now-r.at<6e5){r.played=ch=true;play(r.audio,'Alarm: '+r.t)}if(ch)sv('rem',rem)},2000);
// ---- Memory moved into Settings ----
const _s=settings;settings=function(){_s();const g=document.querySelector('.settings-grid');if(!g)return;
 const old=document.getElementById('memoryEnabled');if(old)old.closest('label').remove();
 g.insertAdjacentHTML('beforeend',`<section class="sec span-all"><div class="label">Memory</div><label class="row"><span class="setting-copy"><strong>Use saved memory</strong><small>When off, NOVA ignores and won’t save memories.</small></span><input class="sw" type="checkbox" id="memT" ${cfg.mem?'checked':''} aria-label="Memory on or off"></label><div class="cmp"><input class="t" id="mi2" placeholder="Add something to remember"><button class="btn pri" onclick="NA.memAdd()">Save</button></div>${mem.length?mem.map(m=>`<div class="item"><span>${esc(m.t)}</span><button class="btn" onclick="NA.memEdit(${m.id})">Edit</button><button class="btn danger" onclick="NA.memDel(${m.id})">Delete</button></div>`).join(''):'<div class="helper">Nothing remembered yet.</div>'}</section>`);
 document.getElementById('memT').onchange=e=>{cfg.mem=e.target.checked;sv('cfg',cfg)}};
const hideMem=()=>{const b=document.querySelector('.ditem[data-id=memory]');if(b)b.style.display='none'};hideMem();
const _go=go;go=function(id){return _go(id==='memory'?'settings':id)};
// ---- typing indicator + send button loading ----
const _ss=setState;setState=function(s){_ss(s);const think=s==='thinking'||s==='searching',m=document.getElementById('msgs'),b=document.querySelector('.chat-compose .btn.pri');
 if(b)b.classList.toggle('busy',think);if(window.PG==='chat'&&m){let t=document.getElementById('typing');if(think&&!t){m.insertAdjacentHTML('beforeend','<div class="msg assistant typing" id="typing" aria-label="NOVA is typing"><i></i><i></i><i></i></div>');m.lastElementChild.scrollIntoView()}else if(!think&&t)t.remove()}};
// ---- Tap-to-talk: stop long-press text selection / context menu ----
const mb=document.getElementById('micBtn');if(mb){mb.addEventListener('contextmenu',e=>e.preventDefault());mb.removeAttribute('title')}
})();
</script>

(()=>{
const css=`

document.head.append(Object.assign(document.createElement('style'),{textContent:css}));

// ---- new voice background: flowing ribbons driven by the real state ----
const vb=document.createElement('canvas');vb.id='vbg';vb.setAttribute('aria-hidden','true');$('#v-voice').prepend(vb);const c=vb.getContext('2d');
const P={idle:[.25,.35,[103,232,249]],listening:[.6,.8,[94,234,212]],thinking:[.9,1.9,[167,139,250]],speaking:[.8,1.2,[125,211,252]],searching:[.5,1.3,[103,232,249]],error:[.3,.4,[251,113,133]]};
let w=0,h=0,T=0,lt=0,amp=.25,spd=.35,col=[103,232,249];
const fit=()=>{const r=vb.getBoundingClientRect();w=vb.width=Math.max(1,r.width/2|0);h=vb.height=Math.max(1,r.height/2|0)};addEventListener('resize',()=>{w=0});
(function loop(n){requestAnimationFrame(loop);if(document.hidden||opts.reduced||!$('#v-voice').classList.contains('on')||n-lt<33)return;const dt=Math.min((n-lt)/1000,.1);lt=n;if(!w)fit();
 const p=P[state]||P.idle,k=1-Math.exp(-dt*3);amp+=((p[0]+(state==='listening'?voiceLevel*.6:0))-amp)*k;spd+=(p[1]-spd)*k;for(let i=0;i<3;i++)col[i]+=(p[2][i]-col[i])*k;T+=dt*spd;
 c.clearRect(0,0,w,h);for(let j=0;j<5;j++){c.beginPath();for(let x=0;x<=w;x+=6){const u=x/w,y=h*(.26+.12*j)+Math.sin(u*5+T+j*1.3)*h*.18*amp+Math.sin(u*11-T*1.4+j)*h*.06*amp;x?c.lineTo(x,y):c.moveTo(x,y)}
  c.strokeStyle=`rgba(${col[0]|0},${col[1]|0},${col[2]|0},${.06+.06*amp})`;c.lineWidth=2+j;c.stroke()}})(0);
// ---- Research ----
R.research=()=>hd('Research','Search the web, read the sources, decide for yourself.')+`<div class="n2-search"><input class="t" id="qi" aria-label="Research question" placeholder="Ask something that needs sources…" onkeydown="event.key==='Enter'&&doRes()"><button class="btn pri" id="qb" onclick="doRes()">Search</button></div><div class="n2-skel" id="rl" hidden><i></i><i></i><i></i></div>`+
 (res.length?res.slice().reverse().map(r=>{const n=(r.sources||[]).length;return`<article class="n2-card"><div class="n2-top"><b>${esc(r.q)}</b><span class="n2-badge ${n?'ok':'warn'}">${n?n+' sources':'No sources · unverified'}</span></div><div class="n2-body">${esc(r.text)}</div>${n?`<div class="n2-srcs">${r.sources.map((s,i)=>`<a target="_blank" rel="noopener" href="${safe(s.url)}"><em>${i+1}</em>${esc(s.title)}</a>`).join('')}</div>`:''}</article>`}).join(''):empty('No research yet. Your searches are saved here.'));
const _d=doRes;doRes=async function(){const l=$('#rl');if(l&&$('#qi').value.trim())l.hidden=false;await _d()};
// ---- Social ----
const SOC={p:'TikTok',k:'Titles',txt:'',out:''},SK={Titles:'Write 5 catchy title options',Captions:'Write 3 captions',Hashtags:'Suggest 15 relevant hashtags',Ideas:'Give 6 content ideas'},TI={Titles:'T',Captions:'✎',Hashtags:'#',Ideas:'✦'};
R.social=()=>hd('Social Studio','Titles, captions, hashtags and ideas. No promised results.')+`<div class="n2-chips">${['TikTok','YouTube','Instagram','Facebook'].map(p=>`<button class="chip" aria-pressed="${SOC.p===p}" onclick="NS.set('p','${p}')">${p}</button>`).join('')}</div><div class="n2-tools">${Object.keys(SK).map(k=>`<button class="n2-tool ${SOC.k===k?'on':''}" onclick="NS.set('k','${k}')"><span>${TI[k]}</span>${k}</button>`).join('')}</div><textarea class="t" id="si" rows="4" placeholder="Describe your video or post…">${esc(SOC.txt)}</textarea><button class="btn pri" id="sb" onclick="NS.run()">Generate</button>`+(SOC.out?`<article class="n2-card"><div class="n2-top"><b>${SOC.k} · ${SOC.p}</b><button class="btn" onclick="navigator.clipboard.writeText(SOC.out).then(()=>toast('Copied'))">Copy</button></div><div class="n2-body">${esc(SOC.out)}</div></article>`:'');
window.SOC=SOC;window.NS={set(k,v){SOC.txt=$('#si').value;SOC[k]=v;render('social')},async run(){const x=$('#si').value.trim();if(!x)return toast('Describe your post first.');SOC.txt=x;$('#sb').classList.add('busy');
 try{const d=await llm([{role:'user',content:`${SK[SOC.k]} for ${SOC.p}. Never promise views or followers. Topic: ${x}`}]);SOC.out=d.text}catch(e){toast(e.message)}render('social')}};
// ---- Screen ----
R.screen=()=>hd('Screen Share','Starts only when you approve. Stop any time.')+`<div class="n2-screen ${shareStream?'live':''}"><div class="n2-ring"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></div><b>${shareStream?'Sharing is ON':'Sharing is OFF'}</b><small class="dim">${shareStream?'Captured in this browser only. Nothing is uploaded.':'Nothing is being captured.'}</small>${shareStream?'<button class="btn danger" onclick="stopShare()">Stop sharing</button>':'<button class="btn pri" onclick="startShare()">Start sharing</button>'}</div><div class="helper">Capturing the whole Android screen needs the native app. This uses your browser’s own screen-capture prompt.</div>`;
// ---- Profile ----
R.profile=()=>hd('Profile','Your name, picture and language.')+`<div class="n2-prof"><div class="n2-av">${cfg.pic?`<img alt="" src="${cfg.pic}">`:esc((cfg.name||'N')[0].toUpperCase())}</div><label class="btn">Change picture<input type="file" accept="image/*" hidden onchange="setPic(this.files[0])"></label></div><div class="sec"><label class="setting-field">Name<input class="t" value="${esc(cfg.name)}" onchange="cfg.name=this.value.trim()||'NOVA User';sv('cfg',cfg);updHeader()"></label><div class="label">Language</div><div class="n2-seg"><button class="${cfg.lang==='en'?'on':''}" onclick="setLang('en')">English</button><button class="${cfg.lang==='so'?'on':''}" onclick="setLang('so')">Soomaali</button></div></div><div class="n2-stats"><div><b>${msgs.length}</b><small>Messages</small></div><div><b>${tasks.length}</b><small>Tasks</small></div><div><b>${mem.length}</b><small>Memories</small></div></div>`;
const _sp=setPic;setPic=function(f){_sp(f);setTimeout(()=>{if(window.PG==='profile')render('profile')},700)};
// ---- Smart Apps (opens apps via links; you press Send yourself) ----
const APPS=[['whatsapp','WhatsApp','whatsapp://send','https://wa.me/'],['youtube','YouTube','vnd.youtube://','https://youtube.com'],['tiktok','TikTok','snssdk1128://','https://tiktok.com'],['instagram','Instagram','instagram://app','https://instagram.com'],['facebook','Facebook','fb://','https://facebook.com'],['telegram','Telegram','tg://','https://t.me'],['gmail','Gmail','googlegmail://','https://mail.google.com'],['maps','Maps','geo:0,0','https://maps.google.com']];
let allowed=ld('apps',{}),draft='';
R.apps=()=>hd('Smart Apps','Choose which apps NOVA may open for you.')+`<div class="n2-apps">${APPS.map(a=>`<div class="n2-app"><span class="tile">${a[1][0]}</span><b>${a[1]}</b><div class="r"><input class="sw" type="checkbox" aria-label="Allow ${a[1]}" ${allowed[a[0]]?'checked':''} onchange="NP.allow('${a[0]}',this.checked)"><button class="btn" onclick="NP.open('${a[0]}')">Open</button></div></div>`).join('')}</div>
<div class="sec"><div class="label">Reply draft</div><textarea class="t" id="mr" rows="3" placeholder="Paste the message you received…"></textarea><button class="btn pri" id="mb" onclick="NP.draft()">Draft a reply</button>${draft?`<textarea class="t" id="md" rows="4">${esc(draft)}</textarea><button class="btn" onclick="NP.send()">Open WhatsApp with this reply</button>`:''}<div class="helper">NOVA can’t read other apps or send for you. You review the text and press Send yourself.</div></div><button class="btn danger" onclick="stopAll()">Emergency stop</button>`;
window.NP={allow(id,v){allowed[id]=v;sv('apps',allowed)},open(id){const a=APPS.find(x=>x[0]===id);if(!allowed[id])return toast('Turn the switch on to allow '+a[1]+'.');let left=false;const h=()=>{if(document.hidden)left=true};document.addEventListener('visibilitychange',h);location.href=a[2];setTimeout(()=>{document.removeEventListener('visibilitychange',h);if(!left)window.open(a[3],'_blank')},1200)},
 async draft(){const x=$('#mr').value.trim();if(!x)return;$('#mb').classList.add('busy');try{const d=await llm([{role:'user',content:'Write a short, polite reply in the same language to this message. Reply text only: '+x}]);draft=d.text}catch(e){toast(e.message)}render('apps')},
 send(){const t=$('#md').value.trim();if(t&&confirm('Open WhatsApp with this text? You still press Send yourself.\n\n'+t))window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank')}};
})();
</script>
<script>
// NOVA add-on 3: new large plasma-sphere home animation and animated NOVA letters
(()=>{
const css=`
#orb{width:min(124vw,76vh,780px)!important;max-width:none!important}
.stage{overflow:visible;min-height:min(62vh,560px)}
.core-center{display:none!important}
.core-state{top:auto!important;bottom:3%}
.wordmark{position:relative;display:inline-flex!important;gap:.22em;font-size:24px!important;letter-spacing:0!important;padding-left:0!important;background:none!important;-webkit-background-clip:border-box!important;background-clip:border-box!important;color:inherit!important;animation:none!important;filter:none!important}
.launch-word{display:inline-flex;gap:.3em;letter-spacing:0!important;padding-left:0!important}
.wordmark i,.launch-word i{font-style:normal;display:inline-block;background:linear-gradient(100deg,#67e8f9,#fff 25%,#a78bfa 50%,#67e8f9 75%,#fff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
 animation:n3in .9s cubic-bezier(.2,.8,.2,1) both,n3shine 4.5s linear infinite,n3float 3.6s ease-in-out infinite;animation-delay:calc(var(--d)*.12s),calc(var(--d)*-.35s),calc(var(--d)*.25s);filter:drop-shadow(0 0 9px #67e8f980)}
@keyframes n3in{from{opacity:0;transform:translateY(12px) scale(.7);filter:blur(6px)}}
@keyframes n3shine{to{background-position:-300% 0}}
@keyframes n3float{50%{transform:translateY(-2px)}}
.wordmark::after{content:"";position:absolute;left:0;right:.22em;bottom:-5px;height:1px;background:linear-gradient(90deg,transparent,#67e8f9,#a78bfa,transparent);background-size:200% 100%;animation:n3line 3s linear infinite}
@keyframes n3line{to{background-position:-200% 0}}`;
document.head.append(Object.assign(document.createElement('style'),{textContent:css}));
const split=e=>{if(!e||e.dataset.n3)return;e.dataset.n3=1;e.innerHTML=[...e.textContent.trim()].map((ch,i)=>`<i style="--d:${i}">${ch}</i>`).join('')};
split($('.wordmark'));split($('.launch-word'));
// ---- plasma sphere: 3D point cloud + constellation links + energy halo, all driven by the real state ----
const N=240,pts=[],edges=[],pr=new Array(N),TAUv=Math.PI*2;
for(let i=0;i<N;i++){const y=1-2*(i+.5)/N,rr=Math.sqrt(1-y*y),a=i*2.399963;pts.push({x:Math.cos(a)*rr,y,z:Math.sin(a)*rr,ph:(i*7.31)%6.28})}
{const seen=new Set();for(let i=0;i<N;i++){const d=[];for(let j=0;j<N;j++)if(j!==i)d.push([pts[i].x*pts[j].x+pts[i].y*pts[j].y+pts[i].z*pts[j].z,j]);d.sort((a,b)=>b[0]-a[0]);
 for(let k=0;k<2;k++){const j=d[k][1],key=i<j?i+'-'+j:j+'-'+i;if(!seen.has(key)){seen.add(key);edges.push([i,j])}}}}
let E=0;
draw=function(){
 if(!W)size();
 const r=W/2,t=time,cx=r,cy=r,P=cur.p,Sc=cur.s;
 const tgt=state==='speaking'?.4+.3*(.5+.5*Math.sin(t*6.3))+voiceLevel*.1:state==='listening'?.15+voiceLevel*.85:state==='thinking'?.55:state==='searching'?.3:state==='error'?.1:.05;
 E+=(tgt-E)*.1;
 const R=r*.5*(1+.03*Math.sin(t*1.1)+E*.08);
 ctx.clearRect(0,0,W,W);
 let g=ctx.createRadialGradient(cx,cy,0,cx,cy,r);g.addColorStop(0,rgba(P,.24+E*.22));g.addColorStop(.45,rgba(Sc,.09+E*.06));g.addColorStop(1,rgba(Sc,0));ctx.fillStyle=g;ctx.fillRect(0,0,W,W);
 if(state==='listening'||state==='speaking')for(let i=0;i<3;i++){const q=(t*.3+i/3)%1;ctx.beginPath();ctx.arc(cx,cy,R*(1.1+q*.75),0,TAUv);ctx.strokeStyle=rgba(P,(1-q)*(.1+E*.35));ctx.lineWidth=Math.max(1,r*.004);ctx.stroke()}
 ctx.lineCap='round';
 for(let i=0;i<96;i++){const a=i/96*TAUv+phase*.15,w=.5+.5*Math.sin(i*.9-t*(state==='speaking'?7:2.5)+Math.sin(i*.3)*2),len=r*(.012+E*.09*w),r0=R*1.2;
  ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*r0,cy+Math.sin(a)*r0);ctx.lineTo(cx+Math.cos(a)*(r0+len),cy+Math.sin(a)*(r0+len));ctx.strokeStyle=rgba(i%3?P:Sc,.16+E*.5*w);ctx.lineWidth=Math.max(1,r*.0045);ctx.stroke()}
 const cr=R*(.52+E*.12);g=ctx.createRadialGradient(cx,cy,0,cx,cy,cr);g.addColorStop(0,'rgba(255,255,255,.95)');g.addColorStop(.25,rgba(P,.75));g.addColorStop(.6,rgba(Sc,.28));g.addColorStop(1,rgba(Sc,0));ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,cr,0,TAUv);ctx.fill();
 const ay=phase*.8,ax=.38+.12*Math.sin(t*.25),cY=Math.cos(ay),sY=Math.sin(ay),cX=Math.cos(ax),sX=Math.sin(ax),scan=state==='searching'?Math.sin(t*1.7):9;
 for(let i=0;i<N;i++){const p=pts[i],dp=1+((state==='speaking'||state==='listening')?.16*E*Math.sin(p.ph*2+t*7+p.y*6):.025*Math.sin(t*.9+p.ph))+(state==='error'?.03*Math.sin(t*40+p.ph):0);
  const x=p.x*dp,y=p.y*dp,z=p.z*dp,x2=x*cY+z*sY,z2=-x*sY+z*cY,y2=y*cX-z2*sX,z3=y*sX+z2*cX,f=1/(1-z3*.28);
  pr[i]={x:cx+x2*R*f,y:cy+y2*R*f,z:z3,f,b:Math.max(0,1-Math.abs(p.y-scan)*5)}}
 ctx.lineWidth=Math.max(1,r*.0025);const eo=state==='thinking'?.36:state==='idle'?.12:.18+E*.1;
 for(const e of edges){const a=pr[e[0]],b=pr[e[1]],z=(a.z+b.z)/2,al=eo*(.25+.75*(z+1)/2)+(a.b+b.b)*.12;ctx.strokeStyle=rgba(z>0?P:Sc,al);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}
 for(let i=0;i<N;i++){const q=pr[i],d=(q.z+1)/2,s=r*.0058*q.f*(.7+d*.9+E*.6+q.b*1.5);ctx.fillStyle=rgba(i%4?P:Sc,.25+d*.6+q.b*.4);ctx.beginPath();ctx.arc(q.x,q.y,s,0,TAUv);ctx.fill()}
 for(let i=0;i<3;i++){ctx.save();ctx.translate(cx,cy);ctx.rotate(i*1.05+phase*(i%2?-.5:.4));const rx=R*(1.22+i*.1),ry=R*(.34+i*.07);
  ctx.beginPath();ctx.ellipse(0,0,rx,ry,0,0,TAUv);ctx.strokeStyle=rgba(i===1?Sc:P,.12+E*.15+(state==='thinking'?.15:0));ctx.lineWidth=Math.max(1,r*.003);ctx.stroke();
  const a=t*(.6+i*.25)*(state==='thinking'?3:1)+i*2;ctx.beginPath();ctx.arc(Math.cos(a)*rx,Math.sin(a)*ry,r*.011,0,TAUv);ctx.fillStyle=rgba(P,.95);ctx.shadowColor=rgba(P,1);ctx.shadowBlur=r*.04;ctx.fill();ctx.restore()}
};
})();
</script>
